# f2run settings on the F2 host (sourced by the f2run scripts)
AGFI=agfi-02410ef1a8461b435            # f2_gemmini_rocket_ddr3llc_60mhz (FireSimGemminiRocketConfig, FRFCFS16GBQuadRankLLC4MB_BaseF2Config, 60 MHz)
DRIVER_DIR=/opt/f2run/drv              # driver-bundle.tar.gz of that build
DRIVER_ARGS="+permissive +macaddr0=00:12:6D:00:00:02 +niclog0=niclog0 +trace-select=1 +trace-start=0 +trace-end=-1 +trace-output-format=0 +autocounter-readrate=0 +autocounter-filename-base=AUTOCOUNTERFILE +print-start=0 +print-end=-1 +linklatency0=6405 +netbw0=200 +shmemportname0=default"
RUN_TIMEOUT=14400                      # wall seconds per ELF
IDLE_STOP_MIN=30                       # stop the instance after this long with no f2-exec
